name: Fork release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    name: Compute release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          upstream_url="https://github.com/openai/codex.git"
          git fetch --force --prune "$upstream_url" 'refs/tags/*:refs/tags/upstream/*'

          # Find the upstream tag whose merge-base is closest to HEAD.
          best_tag=""
          best_dist=999999999
          short=$(git rev-parse --short=7 HEAD)

          while IFS= read -r tag; do
            mb=$(git merge-base HEAD "$tag" 2>/dev/null) || continue
            dist=$(git rev-list --count "$mb..HEAD" 2>/dev/null) || continue

            if [ "$dist" -lt "$best_dist" ]; then
              best_dist=$dist
              best_tag=$tag
            fi
          done < <(git tag -l 'upstream/rust-v*')

          if [ -n "$best_tag" ]; then
            tag_ver=${best_tag#upstream/rust-v}
            version="${tag_ver}-${short}"
          else
            version="0.0.0-${short}"
          fi

          echo "tag=fork-v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version (upstream tag: ${best_tag:-none}, distance: ${best_dist})"

  build-unix:
    name: Build ${{ matrix.label }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: codex-x86_64-unknown-linux-musl.tar.zst
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: codex-aarch64-unknown-linux-musl.tar.zst
          - label: macOS amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: codex-x86_64-apple-darwin.tar.zst
          - label: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            archive: codex-aarch64-apple-darwin.tar.zst
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: codex-rs -> target

      - name: Force rebuild V8 archive after cache restore
        working-directory: codex-rs
        shell: bash
        run: cargo clean --package v8 --target "${{ matrix.target }}" --release

      - if: ${{ runner.os == 'Linux' }}
        name: Install Zig
        shell: bash
        env:
          ZIG_VERSION: 0.14.0
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64)
              zig_arch=x86_64
              zig_sha256=473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982
              ;;
            ARM64)
              zig_arch=aarch64
              zig_sha256=ab64e3ea277f6fc5f3d723dcd95d9ce1ab282c8ed0f431b4de880d30df891e4f
              ;;
            *)
              echo "Unsupported runner architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac

          zig_dir="zig-linux-${zig_arch}-${ZIG_VERSION}"
          zig_archive="$RUNNER_TEMP/${zig_dir}.tar.xz"
          curl --fail --location --retry 10 --show-error \
            "https://ziglang.org/download/${ZIG_VERSION}/${zig_dir}.tar.xz" \
            --output "$zig_archive"
          echo "${zig_sha256}  ${zig_archive}" | sha256sum --check
          tar -xJf "$zig_archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig_dir" >> "$GITHUB_PATH"

      - if: ${{ runner.os == 'Linux' }}
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ runner.os == 'Linux' }}
        name: Disable aws-lc jitter entropy
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Stamp workspace version
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          cargo_toml = Path("codex-rs/Cargo.toml")
          text = cargo_toml.read_text(encoding="utf-8")
          pattern = re.compile(r'(\[workspace\.package\]\s*version\s*=\s*")[^"]+(")')
          version = os.environ["VERSION"]
          updated, count = pattern.subn(
              lambda match: f"{match.group(1)}{version}{match.group(2)}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not stamp [workspace.package].version")
          cargo_toml.write_text(updated, encoding="utf-8")
          PY

      - if: ${{ runner.os == 'Linux' }}
        name: Build bwrap and export digest
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release --bin bwrap
          bwrap_path="target/${target}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest=$(sha256sum "$bwrap_path" | awk '{print $1}')
          echo "CODEX_BWRAP_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Build package directory
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          package_dir="dist/codex-${target}"
          package_args=(
            --target "$target"
            --variant codex
            --cargo-profile release
            --package-dir "$package_dir"
            --force
          )
          if [ "${{ runner.os }}" = "Linux" ]; then
            package_args+=(--bwrap-bin "codex-rs/target/${target}/release/bwrap")
          fi
          python scripts/build_codex_package.py "${package_args[@]}"

      - if: ${{ runner.os == 'macOS' }}
        name: Ad-hoc sign macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/codex-${{ matrix.target }}"
          codesign --force --sign - "$package_dir/bin/codex"
          codesign --force --sign - "$package_dir/bin/codex-code-mode-host"

      - name: Smoke test package
        shell: bash
        run: '"dist/codex-${{ matrix.target }}/bin/codex" --version'

      - name: Archive package
        shell: bash
        env:
          ARCHIVE_PATH: dist/${{ matrix.archive }}
          PACKAGE_DIR: dist/codex-${{ matrix.target }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY'
          import os
          from pathlib import Path

          from codex_package.archive import write_archive

          write_archive(
              Path(os.environ["PACKAGE_DIR"]),
              Path(os.environ["ARCHIVE_PATH"]),
              force=True,
          )
          PY

      - name: Publish ${{ matrix.label }} artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.metadata.outputs.version }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/${{ matrix.archive }}
          body: |
            Codex CLI fork release with Android/Termux support.

            Version: `${{ needs.metadata.outputs.version }}`
            Commit: `${{ github.sha }}`

            Platform assets are added to this release as their builds complete.

  build-windows:
    name: Build ${{ matrix.label }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            python_arch: x64
            archive: codex-x86_64-pc-windows-msvc.zip
          - label: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64
            archive: codex-aarch64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Configure build environment
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "codex-build"
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          "CARGO_TARGET_DIR=$(Join-Path $buildRoot 'target')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git config --global core.longpaths true
          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
            "LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Configure MSVC toolchain
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Stamp workspace version
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          cargo_toml = Path("codex-rs/Cargo.toml")
          text = cargo_toml.read_text(encoding="utf-8")
          pattern = re.compile(r'(\[workspace\.package\]\s*version\s*=\s*")[^"]+(")')
          version = os.environ["VERSION"]
          updated, count = pattern.subn(
              lambda match: f"{match.group(1)}{version}{match.group(2)}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not stamp [workspace.package].version")
          cargo_toml.write_text(updated, encoding="utf-8")
          PY

      - name: Build package
        shell: pwsh
        run: |
          python scripts/build_codex_package.py `
            --target "${{ matrix.target }}" `
            --variant codex `
            --cargo-profile release `
            --package-dir "dist/codex-${{ matrix.target }}" `
            --archive-output "dist/${{ matrix.archive }}" `
            --force

      - name: Smoke test package
        shell: pwsh
        run: |
          & "dist/codex-${{ matrix.target }}/bin/codex.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "codex.exe --version failed with exit code $LASTEXITCODE"
          }

      - name: Publish ${{ matrix.label }} artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.metadata.outputs.version }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: dist/${{ matrix.archive }}
          body: |
            Codex CLI fork release with Android/Termux support.

            Version: `${{ needs.metadata.outputs.version }}`
            Commit: `${{ github.sha }}`

            Platform assets are added to this release as their builds complete.

  build-android:
    name: Build Android/Termux arm64 on A1
    needs: metadata
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 360
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show runner environment
        run: |
          uname -a
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

      - name: Resolve V8 prebuilt tag from the v8 crate pin
        run: |
          set -euo pipefail
          # The prebuilt librusty_v8 must match the v8 crate exactly: the crate's
          # C++ shims are compiled into the archive, and their signatures change
          # between V8 majors. Deriving the tag here keeps an upstream v8 bump
          # from silently pairing new Rust bindings with an old archive.
          v8_version=$(sed -n 's/^v8 = "=\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$v8_version" ]; then
            echo "Could not read the v8 pin from codex-rs/Cargo.toml" >&2
            exit 1
          fi
          echo "V8_PREBUILT_TAG=v8-v$v8_version" >> "$GITHUB_ENV"
          echo "V8 prebuilt tag: v8-v$v8_version"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-linux-android

      - name: Verify host dependencies
        run: |
          set -euo pipefail
          for tool in clang clang++ curl file gzip java ld.lld llvm-ar llvm-ranlib pkg-config unzip zstd; do
            command -v "$tool"
          done

      - name: Install Android NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""

      - name: Install NDK 27
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Configure Android toolchain
        run: |
          set -euo pipefail
          NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_HOST_TAG="linux-x86_64"
          if [ -d "$NDK_HOME/toolchains/llvm/prebuilt/linux-aarch64" ]; then
            NDK_HOST_TAG="linux-aarch64"
          fi
          NDK_TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/$NDK_HOST_TAG"
          SYSROOT="$NDK_TOOLCHAIN/sysroot"
          RESOURCE_DIR="$NDK_TOOLCHAIN/lib/clang/18"
          BUILTINS="$RESOURCE_DIR/lib/linux/libclang_rt.builtins-aarch64-android.a"

          if [ "$NDK_HOST_TAG" = "linux-aarch64" ]; then
            TOOLCHAIN_BIN="$NDK_TOOLCHAIN/bin"
            LINKER="$TOOLCHAIN_BIN/aarch64-linux-android35-clang"
            CXX="$TOOLCHAIN_BIN/aarch64-linux-android35-clang++"
            AR="$TOOLCHAIN_BIN/llvm-ar"
            RANLIB="$TOOLCHAIN_BIN/llvm-ranlib"
          else
            TOOLCHAIN_BIN="$RUNNER_TEMP/android-a1a-toolchain"
            mkdir -p "$TOOLCHAIN_BIN"
            LINKER="$TOOLCHAIN_BIN/aarch64-linux-android35-clang"
            CXX="$TOOLCHAIN_BIN/aarch64-linux-android35-clang++"
            cat > "$LINKER" <<EOF
          #!/usr/bin/env bash
          exec clang --target=aarch64-linux-android35 --sysroot="$SYSROOT" -resource-dir "$RESOURCE_DIR" -fuse-ld=lld --rtlib=compiler-rt "\$@"
          EOF
            cat > "$CXX" <<EOF
          #!/usr/bin/env bash
          exec clang++ --target=aarch64-linux-android35 --sysroot="$SYSROOT" -resource-dir "$RESOURCE_DIR" -fuse-ld=lld --rtlib=compiler-rt "\$@"
          EOF
            chmod +x "$LINKER" "$CXX"
            AR="$(command -v llvm-ar)"
            RANLIB="$(command -v llvm-ranlib)"
          fi

          file "$LINKER" || true
          "$LINKER" --version
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER"
            echo "CC_aarch64_linux_android=$LINKER"
            echo "CXX_aarch64_linux_android=$CXX"
            echo "AR_aarch64_linux_android=$AR"
            echo "RANLIB_aarch64_linux_android=$RANLIB"
            echo "RUSTFLAGS=-C link-arg=$BUILTINS"
          } >> "$GITHUB_ENV"
          # Create prefixed symlinks that vendored OpenSSL expects
          ln -sf "$RANLIB" "$TOOLCHAIN_BIN/aarch64-linux-android-ranlib"
          ln -sf "$AR"     "$TOOLCHAIN_BIN/aarch64-linux-android-ar"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Configure local build caches
        shell: bash
        run: |
          set -euo pipefail
          cache_root="$HOME/.cache/codex-a1a"
          mkdir -p "$cache_root/cargo-target" "$cache_root/sccache"
          {
            echo "A1A_CACHE_ROOT=$cache_root"
            echo "CARGO_TARGET_DIR=$cache_root/cargo-target"
            echo "SCCACHE_DIR=$cache_root/sccache"
            echo "SCCACHE_CACHE_SIZE=10G"
            echo "SCCACHE_GHA_ENABLED=false"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"
          echo "Using persistent local cache root: $cache_root"

      - name: Wipe cargo-target cache when disk is low
        shell: bash
        run: |
          set -euo pipefail
          # The persistent cargo-target grows by several GB every time the
          # stamped workspace version changes (full rebuild, old artifacts kept).
          # lld mmaps its output, so running out of disk mid-link surfaces as
          # SIGBUS ("Bus error"), not ENOSPC.
          df -h "$A1A_CACHE_ROOT"
          avail_kb=$(df -Pk "$A1A_CACHE_ROOT" | awk 'NR==2 {print $4}')
          avail_gb=$((avail_kb / 1024 / 1024))
          echo "Available: ${avail_gb}G"
          if [ "$avail_gb" -lt 30 ]; then
            echo "Less than 30G free: wiping cargo-target cache"
            du -sh "$CARGO_TARGET_DIR" 2>/dev/null || true
            rm -rf "$CARGO_TARGET_DIR"
            mkdir -p "$CARGO_TARGET_DIR"
            df -h "$A1A_CACHE_ROOT"
          fi

      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2
        with:
          tool: sccache

      - name: Enable sccache wrapper
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Build codex and code-mode host
        env:
          CARGO_BUILD_JOBS: "4"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_STRIP: "symbols"
          RUSTY_V8_ARCHIVE: https://github.com/mevanlc/codex/releases/download/${{ env.V8_PREBUILT_TAG }}/librusty_v8_release_aarch64-linux-android.a.gz
          RUSTY_V8_SRC_BINDING_PATH: /tmp/v8_binding.rs
        run: |
          set -euxo pipefail
          trap 'status=$?; echo "Build codex failed with status $status"; echo "V8-related files under $CARGO_TARGET_DIR:"; find "$CARGO_TARGET_DIR" -maxdepth 10 \( -path "*/build/v8-*/out/*" -o -name "librusty_v8*.a" -o -name "*.sum" \) -print 2>/dev/null | sort || true; exit "$status"' ERR
          echo "Rusty V8 environment:"
          env | sort | grep -E '^(AR_|CC_|CARGO_TARGET_AARCH64|RANLIB_|RUSTFLAGS|RUSTY_V8_)' || true
          echo "Rusty V8 archive headers:"
          curl -fLI "$RUSTY_V8_ARCHIVE"
          curl -fLsS -o /tmp/rusty_v8_archive.a.gz "$RUSTY_V8_ARCHIVE"
          echo "Downloaded archive details:"
          ls -l /tmp/rusty_v8_archive.a.gz
          gzip -l /tmp/rusty_v8_archive.a.gz
          curl -fLsS -o /tmp/v8_binding.rs \
            "https://github.com/mevanlc/codex/releases/download/${V8_PREBUILT_TAG}/src_binding_release_aarch64-linux-android.rs"
          echo "Downloaded binding details:"
          ls -l /tmp/v8_binding.rs
          wc -c /tmp/v8_binding.rs
          sed -n '1,5p' /tmp/v8_binding.rs
          V8_STAGE_DIR="$CARGO_TARGET_DIR/aarch64-linux-android/release/gn_out/obj"
          echo "Pre-staging fresh rusty_v8 into $V8_STAGE_DIR"
          rm -rf "$CARGO_TARGET_DIR/aarch64-linux-android/release/gn_out"
          mkdir -p "$V8_STAGE_DIR"
          gzip -dc /tmp/rusty_v8_archive.a.gz > "$V8_STAGE_DIR/librusty_v8.a"
          printf '%s' "$RUSTY_V8_ARCHIVE" > "$V8_STAGE_DIR/librusty_v8.sum"
          ls -l "$V8_STAGE_DIR/librusty_v8.a" "$V8_STAGE_DIR/librusty_v8.sum"
          echo "Stamping Cargo workspace version to ${{ needs.metadata.outputs.version }}"
          sed -i 's/^version = ".*"$/version = "${{ needs.metadata.outputs.version }}"/' Cargo.toml
          grep -n '^version = "' Cargo.toml | head -1
          cargo build --release \
            --bin codex \
            --bin codex-code-mode-host \
            --target aarch64-linux-android
          echo "Post-build V8-related files under $CARGO_TARGET_DIR:"
          find "$CARGO_TARGET_DIR" -maxdepth 10 \( -path "*/build/v8-*/out/*" -o -name "librusty_v8*.a" -o -name "*.sum" \) -print 2>/dev/null | sort

      - name: Compress binaries
        run: |
          zstd -19 "$CARGO_TARGET_DIR/aarch64-linux-android/release/codex" \
            -o codex-aarch64-linux-android.zst
          zstd -19 "$CARGO_TARGET_DIR/aarch64-linux-android/release/codex-code-mode-host" \
            -o codex-code-mode-host-aarch64-linux-android.zst

      - name: Publish Android/Termux artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.metadata.outputs.version }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            codex-rs/codex-aarch64-linux-android.zst
            codex-rs/codex-code-mode-host-aarch64-linux-android.zst
          body: |
            Codex CLI fork release with Android/Termux support.

            Version: `${{ needs.metadata.outputs.version }}`
            Commit: `${{ github.sha }}`

            Platform assets are added to this release as their builds complete.

      - name: sccache stats
        if: ${{ always() }}
        continue-on-error: true
        run: sccache --show-stats || true

      - name: Local cache disk usage
        if: ${{ always() }}
        continue-on-error: true

name: Build fork for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            python_arch: x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure build environment
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "codex-build"
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null

          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$(Join-Path $buildRoot 'target')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git config --global core.longpaths true

          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
            "LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Configure MSVC toolchain
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Build Codex package
        shell: pwsh
        run: |
          python scripts/build_codex_package.py `
            --target "${{ matrix.target }}" `
            --variant codex `
            --cargo-profile release `
            --package-dir "dist/codex-windows-${{ matrix.arch }}" `
            --archive-output "dist/codex-windows-${{ matrix.arch }}.zip" `
            --force

      - name: Smoke test package
        shell: pwsh
        run: |
          $packageDir = "dist/codex-windows-${{ matrix.arch }}"
          $requiredFiles = @(
            "codex-package.json",
            "bin/codex.exe",
            "bin/codex-code-mode-host.exe",
            "codex-path/rg.exe",
            "codex-resources/codex-command-runner.exe",
            "codex-resources/codex-windows-sandbox-setup.exe"
          )

          foreach ($relativePath in $requiredFiles) {
            $path = Join-Path $packageDir $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Package is missing $relativePath"
            }
          }

          & (Join-Path $packageDir "bin/codex.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "codex.exe --version failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-${{ matrix.arch }}
          path: dist/codex-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
